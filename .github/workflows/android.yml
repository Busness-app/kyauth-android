name: Android

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools --ignore-scripts
      - run: pip install argon2-cffi==25.1.0
      - run: ./gradlew test assembleDebug lintDebug compileDebugAndroidTestSources
      - run: node tools/vault_preservation.js app/build/interop

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb shell settings put system screen_off_timeout 2147483647
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell locksettings set-pin 246810
            adb shell input keyevent KEYCODE_SLEEP
            sleep 1
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent KEYCODE_MENU
            sleep 1
            adb shell input text 246810
            adb shell input keyevent KEYCODE_ENTER
            sleep 1
            adb shell dumpsys window policy | grep -q 'showing=false'
            ./gradlew connectedDebugAndroidTest
